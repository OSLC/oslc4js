<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="540" y="38" text-anchor="middle" font-size="25" font-weight="bold" fill="#1a5276">The Digital Thread — and where AAKI closes the gaps</text>
  <text x="540" y="62" text-anchor="middle" font-size="14" fill="#5a6b7b">OSLC-connected tool/domain nodes across the V-model. Red = the gaps: missing links and missing domain nodes.</text>

  <!-- ===== GOVERNED OSLC LINKS: the V-model backbone (present) ===== -->
  <polyline points="300,210 368,288 436,366 508,440 580,366 648,288 716,210"
            fill="none" stroke="#5a6b7b" stroke-width="2.5" />

  <!-- Governed across-V trace links (present, created) — the horizontal verification traces Instantiate fills in -->
  <g stroke="#5a6b7b" stroke-width="1.8" fill="none">
    <line x1="356" y1="210" x2="660" y2="210"/>   <!-- Requirements <-> Validation -->
    <line x1="492" y1="366" x2="524" y2="366"/>   <!-- Design <-> Integration & Test -->
  </g>

  <!-- ===== V-MODEL NODES (present, governed) ===== -->
  <g font-size="11" fill="#12405f" text-anchor="middle">
    <g><rect x="244" y="191" width="112" height="38" rx="7" fill="#eef4fb" stroke="#1a5276" stroke-width="1.5"/><text x="300" y="214">Requirements</text></g>
    <g><rect x="312" y="269" width="112" height="38" rx="7" fill="#eef4fb" stroke="#1a5276" stroke-width="1.5"/><text x="368" y="292">Architecture</text></g>
    <g><rect x="380" y="347" width="112" height="38" rx="7" fill="#eef4fb" stroke="#1a5276" stroke-width="1.5"/><text x="436" y="370">Design</text></g>
    <g><rect x="452" y="421" width="112" height="38" rx="7" fill="#eef4fb" stroke="#1a5276" stroke-width="1.5"/><text x="508" y="444">Implementation</text></g>
    <g><rect x="524" y="347" width="112" height="38" rx="7" fill="#eef4fb" stroke="#1a5276" stroke-width="1.5"/><text x="580" y="370" font-size="10">Integration &amp; Test</text></g>
    <g><rect x="592" y="269" width="112" height="38" rx="7" fill="#eef4fb" stroke="#1a5276" stroke-width="1.5"/><text x="648" y="292">Verification</text></g>
    <g><rect x="660" y="191" width="112" height="38" rx="7" fill="#eef4fb" stroke="#1a5276" stroke-width="1.5"/><text x="716" y="214">Validation</text></g>
  </g>

  <!-- ===== MISSING DOMAIN NODES (data gap) ===== -->
  <g text-anchor="middle">
    <rect x="90" y="98" width="140" height="44" rx="7" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="160" y="119" font-size="11.5" fill="#c0392b">Business Motivation</text>
    <text x="160" y="134" font-size="9.5" fill="#c0392b" font-style="italic">missing domain (BMM)</text>

    <rect x="90" y="160" width="140" height="44" rx="7" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="160" y="181" font-size="11.5" fill="#c0392b">Portfolio Mgmt</text>
    <text x="160" y="196" font-size="9.5" fill="#c0392b" font-style="italic">missing domain</text>
  </g>

  <!-- ===== MISSING LINKS (dashed red) ===== -->
  <g stroke="#c0392b" stroke-width="2.3" stroke-dasharray="7 6" fill="none" marker-end="url(#arrowRed)">
    <!-- BMM -> Requirements and BMM -> Validation -->
    <line x1="230" y1="126" x2="250" y2="196"/>
    <path d="M232,112 C400,96 560,150 654,200"/>
    <!-- Portfolio -> thread (stub) -->
    <line x1="230" y1="186" x2="248" y2="200"/>
    <!-- Missing INSTANCE link between two existing/defined nodes (Instantiate's job): Architecture <-> Verification trace -->
    <line x1="424" y1="288" x2="588" y2="288"/>
    <!-- ASPICE (missing governance links) -->
    <line x1="828" y1="248" x2="708" y2="286"/>
    <line x1="836" y1="232" x2="774" y2="215"/>
    <!-- ISO 26262 (missing governance links) -->
    <line x1="828" y1="392" x2="640" y2="372"/>
    <line x1="838" y1="410" x2="568" y2="446"/>
  </g>

  <!-- ===== COMPLIANCE FRAMEWORKS (vertical stack, right) ===== -->
  <g text-anchor="middle">
    <rect x="830" y="223" width="150" height="54" rx="8" fill="#fef6e7" stroke="#b9770e" stroke-width="1.8"/>
    <text x="905" y="246" font-size="14.5" font-weight="bold" fill="#8a5a08">ASPICE</text>
    <text x="905" y="263" font-size="10" fill="#8a5a08">process conformance</text>

    <rect x="830" y="373" width="150" height="54" rx="8" fill="#fef6e7" stroke="#b9770e" stroke-width="1.8"/>
    <text x="905" y="396" font-size="14.5" font-weight="bold" fill="#8a5a08">ISO 26262</text>
    <text x="905" y="413" font-size="10" fill="#8a5a08">functional safety</text>
  </g>
  <text x="905" y="455" text-anchor="middle" font-size="10.5" fill="#8a5a08" font-style="italic">criteria &amp; evidence — links into</text>
  <text x="905" y="469" text-anchor="middle" font-size="10.5" fill="#8a5a08" font-style="italic">the thread also missing (not yet OSLC)</text>

  <!-- ===== AAKI-MOVE ANNOTATIONS ===== -->
  <g font-style="italic">
    <text x="160" y="84" text-anchor="middle" font-size="11.5" fill="#1a5276">Define adds missing nodes + their link types</text>
    <text x="300" y="154" text-anchor="middle" font-size="10" fill="#1a5276">a link from a missing domain is Defined with it</text>
    <text x="508" y="248" text-anchor="middle" font-size="11" fill="#12405f">Instantiate helps create link instances anywhere in the thread</text>
  </g>

  <!-- ===== OVERARCHING AI ROLE across Instantiate & Activate ===== -->
  <g>
    <rect x="180" y="498" width="700" height="34" rx="17" fill="#eef7f4" stroke="#1a7f6b" stroke-width="1.5"/>
    <text x="530" y="519" text-anchor="middle" font-size="12" fill="#12604f">AI assists across Instantiate, Activate &amp; Govern — explore → propose → execute, under human governance</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g font-size="11.5" fill="#33475b">
    <rect x="40" y="545" width="470" height="132" rx="8" fill="#f7f9fb" stroke="#c7d2dc" stroke-width="1"/>
    <text x="56" y="567" font-weight="bold" fill="#1a5276">Legend</text>

    <line x1="56" y1="587" x2="96" y2="587" stroke="#5a6b7b" stroke-width="2.5"/>
    <text x="106" y="591">governed OSLC link — present (typed, versioned)</text>

    <line x1="56" y1="611" x2="96" y2="611" stroke="#c0392b" stroke-width="2.3" stroke-dasharray="7 6" marker-end="url(#arrowRed)"/>
    <text x="106" y="615">missing link — not yet defined, or not yet created</text>

    <rect x="56" y="629" width="40" height="16" rx="4" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="106" y="641">missing domain node — the data gap</text>

    <rect x="56" y="653" width="40" height="16" rx="4" fill="#fef6e7" stroke="#b9770e" stroke-width="1.8"/>
    <text x="106" y="665">compliance framework — its governing links are missing too</text>
  </g>
</svg>
