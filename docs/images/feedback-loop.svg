<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title>AAKI feedback loop — Define, Instantiate, Activate, Govern</title>
  <desc>The four AAKI stages form a virtuous cycle: Define populates Instantiate, which feeds Activate, which Govern assesses and improves — and the improvement loop feeds back into Define and Instantiate. AI's role is noted beside each stage.</desc>

  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#2c3e50"/>
    </marker>
    <marker id="arrRed" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#c0392b"/>
    </marker>
  </defs>

  <rect width="1400" height="640" fill="#ffffff"/>

  <!-- ── Improvement loop (dashed) : Govern → back up to Define / Instantiate ── -->
  <path d="M 390 500 C 170 512 100 460 100 300 C 100 140 175 90 386 90"
        fill="none" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="8 6" marker-end="url(#arrRed)"/>
  <text x="112" y="292" fill="#c0392b" font-size="18" font-weight="700">Improvement</text>
  <text x="150" y="314" fill="#c0392b" font-size="18" font-weight="700">loop</text>
  <text x="150" y="340" fill="#c0392b" font-size="12.5" font-style="italic">feeds Define &amp; Instantiate</text>

  <!-- ── Down arrows between stages ── -->
  <g stroke="#2c3e50" stroke-width="2.4" marker-end="url(#arr)">
    <line x1="700" y1="136" x2="700" y2="172"/>
    <line x1="700" y1="274" x2="700" y2="310"/>
    <line x1="700" y1="412" x2="700" y2="448"/>
  </g>
  <g fill="#7f8c8d" font-size="14" font-style="italic">
    <text x="712" y="159">populates</text>
    <text x="712" y="297">feeds</text>
    <text x="712" y="435">governs &amp; improves</text>
  </g>

  <!-- ── Side-note connectors ── -->
  <g stroke="#95a5a6" stroke-width="1.6">
    <line x1="1010" y1="86" x2="1052" y2="86"/>
    <line x1="1010" y1="224" x2="1052" y2="224"/>
    <line x1="1010" y1="362" x2="1052" y2="362"/>
    <line x1="1010" y1="500" x2="1052" y2="500"/>
  </g>

  <!-- ── Stage boxes ── -->
  <g text-anchor="middle">
    <g>
      <rect x="390" y="40" width="620" height="92" rx="12" fill="#1f4e79"/>
      <text x="700" y="80" fill="#ffffff" font-size="24" font-weight="700">Stage 1 — Define</text>
      <text x="700" y="110" fill="#cdd9e8" font-size="15">Vocabulary &amp; ResourceShapes keep the loop coherent</text>
    </g>
    <g>
      <rect x="390" y="178" width="620" height="92" rx="12" fill="#2e86c1"/>
      <text x="700" y="218" fill="#ffffff" font-size="24" font-weight="700">Stage 2 — Instantiate</text>
      <text x="700" y="248" fill="#e1eef7" font-size="15">OSLC server — governed resources &amp; links</text>
    </g>
    <g>
      <rect x="390" y="316" width="620" height="92" rx="12" fill="#229954"/>
      <text x="700" y="356" fill="#ffffff" font-size="24" font-weight="700">Stage 3 — Activate</text>
      <text x="700" y="386" fill="#d9f0e2" font-size="15">MCP / LQE — analytics, AI reasoning, tool views</text>
    </g>
    <g>
      <rect x="390" y="454" width="620" height="92" rx="12" fill="#7d3c98"/>
      <text x="700" y="494" fill="#ffffff" font-size="24" font-weight="700">Stage 4 — Govern</text>
      <text x="700" y="524" fill="#e8dcf0" font-size="15">Continuous conformance &amp; improvement over the thread</text>
    </g>
  </g>

  <!-- ── Side notes: AI's role at each stage ── -->
  <g font-size="13.5" fill="#2c3e50">
    <g>
      <rect x="1052" y="59" width="320" height="54" rx="8" fill="#eef2f4" stroke="#cbd5db"/>
      <text x="1070" y="83">AI reads specs;</text>
      <text x="1070" y="102">authors vocabulary + shapes</text>
    </g>
    <g>
      <rect x="1052" y="197" width="320" height="54" rx="8" fill="#eef2f4" stroke="#cbd5db"/>
      <text x="1070" y="221">AI creates, links, and</text>
      <text x="1070" y="240">validates via MCP</text>
    </g>
    <g>
      <rect x="1052" y="335" width="320" height="54" rx="8" fill="#eef2f4" stroke="#cbd5db"/>
      <text x="1070" y="359">AI consumes the graph;</text>
      <text x="1070" y="378">derives insight, proposes</text>
    </g>
    <g>
      <rect x="1052" y="473" width="320" height="54" rx="8" fill="#eef2f4" stroke="#cbd5db"/>
      <text x="1070" y="497">AI drafts findings &amp; ratings;</text>
      <text x="1070" y="516">a human owns the rating</text>
    </g>
  </g>
</svg>
