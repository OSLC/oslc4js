<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 700" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5a6b7b"/>
    </marker>
    <marker id="arrowGov" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3 L0,6 Z" fill="#b9770e"/>
    </marker>
  </defs>

  <!-- title -->
  <text x="530" y="40" text-anchor="middle" font-size="26" font-weight="bold" fill="#1a5276">The Digital Thread — and where AAKI closes the gaps</text>
  <text x="530" y="66" text-anchor="middle" font-size="15" fill="#5a6b7b">OSLC-connected tool/domain nodes across the V-model; AI + OSLC add the missing links and missing nodes</text>

  <!-- ============ GOVERNED OSLC LINKS (draw first, under nodes) ============ -->
  <g stroke="#5a6b7b" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <line x1="180" y1="140" x2="255" y2="215"/>            <!-- Motivation -> Requirements -->
    <line x1="290" y1="235" x2="345" y2="300"/>            <!-- Requirements -> Architecture -->
    <line x1="380" y1="322" x2="440" y2="392"/>            <!-- Architecture -> Design -->
    <line x1="475" y1="415" x2="520" y2="470"/>            <!-- Design -> Implementation -->
    <line x1="600" y1="480" x2="650" y2="415"/>            <!-- Implementation -> Integration & Test -->
    <line x1="685" y1="392" x2="740" y2="322"/>            <!-- Integration & Test -> Verification -->
    <line x1="775" y1="300" x2="830" y2="235"/>            <!-- Verification -> Validation/Operation -->
  </g>

  <!-- V-model horizontal verification trace (governed) -->
  <g stroke="#8aa0b3" stroke-width="1.6" stroke-dasharray="1 0" fill="none" opacity="0.8">
    <line x1="380" y1="311" x2="655" y2="403"/>            <!-- Architecture <-> Integration & Test -->
  </g>

  <!-- ============ MISSING LINK (connectivity gap) ============ -->
  <line x1="290" y1="224" x2="820" y2="224" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="7 6" fill="none"/>
  <text x="555" y="216" text-anchor="middle" font-size="12.5" fill="#c0392b" font-style="italic">missing link — Requirements not traced to Verification (connectivity gap)</text>

  <!-- ============ THREAD NODES ============ -->
  <!-- helper style: rounded rect + centered label -->
  <g font-size="13.5" fill="#12405f" text-anchor="middle">
    <g>
      <rect x="114" y="118" width="132" height="44" rx="8" fill="#eef4fb" stroke="#1a5276" stroke-width="1.6"/>
      <text x="180" y="145">Business Motivation</text>
    </g>
    <g>
      <rect x="224" y="202" width="132" height="44" rx="8" fill="#eef4fb" stroke="#1a5276" stroke-width="1.6"/>
      <text x="290" y="229">Requirements</text>
    </g>
    <g>
      <rect x="279" y="289" width="132" height="44" rx="8" fill="#eef4fb" stroke="#1a5276" stroke-width="1.6"/>
      <text x="345" y="316">Architecture</text>
    </g>
    <g>
      <rect x="374" y="381" width="132" height="44" rx="8" fill="#eef4fb" stroke="#1a5276" stroke-width="1.6"/>
      <text x="440" y="408">Design</text>
    </g>
    <g>
      <rect x="534" y="459" width="132" height="44" rx="8" fill="#eef4fb" stroke="#1a5276" stroke-width="1.6"/>
      <text x="600" y="486">Implementation</text>
    </g>
    <g>
      <rect x="619" y="381" width="132" height="44" rx="8" fill="#eef4fb" stroke="#1a5276" stroke-width="1.6"/>
      <text x="685" y="408">Integration &amp; Test</text>
    </g>
    <g>
      <rect x="714" y="289" width="132" height="44" rx="8" fill="#eef4fb" stroke="#1a5276" stroke-width="1.6"/>
      <text x="780" y="316">Verification</text>
    </g>
    <g>
      <rect x="809" y="202" width="150" height="44" rx="8" fill="#eef4fb" stroke="#1a5276" stroke-width="1.6"/>
      <text x="884" y="229">Validation / Operation</text>
    </g>
  </g>

  <!-- ============ MISSING NODE (data gap) ============ -->
  <g>
    <rect x="70" y="202" width="132" height="44" rx="8" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="136" y="223" text-anchor="middle" font-size="12.5" fill="#c0392b">Portfolio Mgmt</text>
    <text x="136" y="239" text-anchor="middle" font-size="11" fill="#c0392b" font-style="italic">missing node (data gap)</text>
  </g>
  <!-- would-be link from missing node into the thread -->
  <line x1="202" y1="220" x2="224" y2="222" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>

  <!-- ============ COMPLIANCE FRAMEWORKS (off to the side, govern via links in) ============ -->
  <g>
    <rect x="646" y="600" width="150" height="52" rx="8" fill="#fef6e7" stroke="#b9770e" stroke-width="1.8"/>
    <text x="721" y="622" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8a5a08">ASPICE</text>
    <text x="721" y="640" text-anchor="middle" font-size="11" fill="#8a5a08">own OSLC vocabulary</text>
  </g>
  <g>
    <rect x="820" y="600" width="150" height="52" rx="8" fill="#fef6e7" stroke="#b9770e" stroke-width="1.8"/>
    <text x="895" y="622" text-anchor="middle" font-size="14.5" font-weight="bold" fill="#8a5a08">ISO 26262</text>
    <text x="895" y="640" text-anchor="middle" font-size="11" fill="#8a5a08">own OSLC vocabulary</text>
  </g>

  <!-- governance links into the thread -->
  <g stroke="#b9770e" stroke-width="1.5" stroke-dasharray="4 4" fill="none" marker-end="url(#arrowGov)" opacity="0.9">
    <path d="M700,600 C660,520 320,360 320,335"/>          <!-- ASPICE -> Architecture -->
    <path d="M735,600 C760,500 780,360 782,335"/>          <!-- ASPICE -> Verification -->
    <path d="M865,600 C700,520 460,440 452,427"/>          <!-- ISO 26262 -> Design -->
    <path d="M920,600 C960,480 900,300 892,248"/>          <!-- ISO 26262 -> Validation/Operation -->
  </g>
  <text x="808" y="590" text-anchor="middle" font-size="12" fill="#8a5a08" font-style="italic">compliance frameworks govern the thread's evolution — linking in, from the side</text>

  <!-- ============ AAKI MOVE ANNOTATIONS ============ -->
  <g font-size="12.5" font-style="italic" fill="#1a5276">
    <text x="136" y="188" text-anchor="middle">Define adds the missing node</text>
    <text x="555" y="188" text-anchor="middle" fill="#c0392b" opacity="0"> </text>
    <text x="985" y="470" text-anchor="end">Instantiate adds the missing links</text>
    <text x="985" y="490" text-anchor="end">Activate queries the whole thread</text>
  </g>

  <!-- ============ LEGEND ============ -->
  <g font-size="12" fill="#33475b">
    <rect x="30" y="500" width="330" height="132" rx="8" fill="#f7f9fb" stroke="#c7d2dc" stroke-width="1"/>
    <text x="46" y="522" font-weight="bold" fill="#1a5276">Legend</text>

    <line x1="46" y1="542" x2="86" y2="542" stroke="#5a6b7b" stroke-width="2" marker-end="url(#arrow)"/>
    <text x="96" y="546">governed OSLC link (typed, versioned)</text>

    <line x1="46" y1="566" x2="86" y2="566" stroke="#c0392b" stroke-width="2.6" stroke-dasharray="7 6"/>
    <text x="96" y="570">missing link — connectivity / traceability gap</text>

    <rect x="46" y="582" width="40" height="16" rx="4" fill="none" stroke="#c0392b" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="96" y="594">missing node — domain data gap</text>

    <line x1="46" y1="614" x2="86" y2="614" stroke="#b9770e" stroke-width="1.5" stroke-dasharray="4 4" marker-end="url(#arrowGov)"/>
    <text x="96" y="618">compliance framework governs (links in)</text>
  </g>
</svg>
